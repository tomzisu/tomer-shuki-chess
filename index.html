  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #202024;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      direction: ltr !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    #app-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 10px;
    }
    
    #board-box {
      width: min(92vw, calc(90vh - 80px), calc(90dvh - 80px), 480px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    #board {
      width: 100%;
      touch-action: none;
    }

    /* Navigation Controls below the board */
    #nav-bar {
      width: 100%;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #2a2a30;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .nav-btn {
      background: #383840;
      color: #f0d9b5;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      width: 48px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      outline: none;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      flex-shrink: 0;
    }

    .nav-btn:active {
      background: #4a4a55;
      transform: scale(0.94);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
    }

    #move-indicator {
      flex: 1;
      text-align: center;
      color: #f0d9b5;
      font-size: 14px;
      font-weight: 500;
      direction: rtl;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
      line-height: 1.3;
    }

    #move-subtext {
      display: block;
      font-size: 11px;
      color: #9e9ea8;
      font-weight: normal;
      margin-top: 1px;
    }

    /* Core chessboard layout rules */
    .clearfix-7da63 {
      clear: both;
    }
    
    .board-b72b1 {
      border: 0 !important;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      box-sizing: content-box;
      margin: 0 auto;
    }

    .row-5277c {
      clear: both;
    }

    .square-55d63 {
      float: left;
      position: relative;
      padding: 0;
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    .square-55d63 img.piece-417db {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Classic board colors */
    .white-1e1d7 {
      background-color: #f0d9b5 !important;
      color: #b58863 !important;
    }
    
    .black-3c85d {
      background-color: #b58863 !important;
      color: #f0d9b5 !important;
    }

    .highlight1-32417 {
      box-shadow: inset 0 0 4px 3px rgba(247, 247, 105, 0.8) !important;
    }

    .highlight2-9c5d2 {
      box-shadow: inset 0 0 4px 3px rgba(235, 235, 80, 0.8) !important;
    }

    /* Subtle Sync Status Indicator */
    #status-dot {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4CAF50;
      opacity: 0.5;
      transition: opacity 0.3s;
      z-index: 10000;
    }
    #status-dot.syncing {
      background-color: #FFC107;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="board-box">
      <div id="board"></div>
      
      <!-- History Navigation Bar -->
      <div id="nav-bar">
        <button id="btn-prev" class="nav-btn" aria-label="מהלך קודם אחורה בזמן" title="מהלך קודם">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        
        <div id="move-indicator">
          <span id="move-main-text">טוען נתונים...</span>
          <span id="move-subtext"></span>
        </div>

        <button id="btn-next" class="nav-btn" aria-label="מהלך הבא קדימה בזמן" title="מהלך הבא">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
    
    <div id="status-dot" title="מצב חיבור"></div>
  </div>

  <!-- jQuery, Chess.js, Chessboard.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.js"></script>

  <script>
    const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
    let board = null;
    let liveGame = new Chess();
    let currentGameState = null;
    let isMoving = false;
    let pollInterval = null;

    let fensTimeline = [START_FEN];
    let movesTimeline = [];
    let currentViewIndex = 0;
    let isAtLatest = true;

    function pieceTheme(piece) {
      return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
    }

    function onDragStart(source, piece, position, orientation) {
      // If we are reviewing historical moves, dragging is not allowed
      if (!isAtLatest || currentViewIndex !== (fensTimeline.length - 1)) {
        return false;
      }
      
      if (liveGame.game_over()) return false;
      if (!currentGameState) return false;
      if (isMoving) return false;

      const tomerColor = currentGameState.tomer_color || 'w';
      
      // Allow moving only on Tomer's turn
      if (liveGame.turn() !== tomerColor) {
        return false;
      }

      // Allow dragging only Tomer's pieces
      const pieceColor = piece.search(/^w/) !== -1 ? 'w' : 'b';
      if (pieceColor !== tomerColor) {
        return false;
      }

      return true;
    }

    function onDrop(source, target) {
      if (!isAtLatest || currentViewIndex !== (fensTimeline.length - 1)) {
        return 'snapback';
      }

      const move = liveGame.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      isMoving = true;
      setSyncing(true);

      const moveData = {
        player: 'tomer',
        from: source,
        to: target,
        san: move.san,
        uci: source + target + (move.promotion ? move.promotion : ''),
        fenAfter: liveGame.fen(),
        isGameOver: liveGame.game_over(),
        result: liveGame.in_checkmate() ? 'checkmate' : (liveGame.in_draw() ? 'draw' : '')
      };

      // Optimistically push to local timeline
      movesTimeline.push({
        moveNumber: movesTimeline.length + 1,
        player: 'tomer',
        san: move.san,
        uci: moveData.uci,
        fenAfter: moveData.fenAfter
      });
      fensTimeline.push(moveData.fenAfter);
      currentViewIndex = fensTimeline.length - 1;
      isAtLatest = true;
      updateUI();

      google.script.run
        .withSuccessHandler(function(response) {
          isMoving = false;
          setSyncing(false);
          if (response && response.gameState) {
            applyGameState(response.gameState);
          }
        })
        .withFailureHandler(function(err) {
          isMoving = false;
          setSyncing(false);
          liveGame.undo();
          fensTimeline.pop();
          movesTimeline.pop();
          currentViewIndex = fensTimeline.length - 1;
          updateUI();
          board.position(liveGame.fen());
        })
        .recordMove(moveData);
    }

    function onSnapEnd() {
      if (isAtLatest) {
        board.position(liveGame.fen());
      }
    }

    function setSyncing(syncing) {
      const dot = document.getElementById('status-dot');
      if (syncing) {
        dot.classList.add('syncing');
      } else {
        dot.classList.remove('syncing');
      }
    }

    let hasLoadedFirstState = false;

    function rebuildTimeline(state) {
      const wasAtLatest = isAtLatest;
      
      if (state.history && Array.isArray(state.history) && state.history.length > 0) {
        movesTimeline = state.history;
        fensTimeline = [START_FEN].concat(state.history.map(function(h) { return h.fenAfter; }));
      } else if (state.pgn) {
        const temp = new Chess();
        temp.load_pgn(state.pgn);
        const historyMoves = temp.history({ verbose: true });
        const replay = new Chess();
        movesTimeline = [];
        fensTimeline = [START_FEN];
        historyMoves.forEach(function(m, idx) {
          replay.move(m);
          const fenAfter = replay.fen();
          fensTimeline.push(fenAfter);
          movesTimeline.push({
            moveNumber: idx + 1,
            san: m.san,
            uci: m.from + m.to + (m.promotion || ''),
            player: (idx % 2 === 0) ? (state.tomer_color === 'w' ? 'tomer' : 'shuki') : (state.tomer_color === 'w' ? 'shuki' : 'tomer'),
            fenAfter: fenAfter
          });
        });
      } else if (state.fen && state.fen !== START_FEN) {
        movesTimeline = [{
          moveNumber: 1,
          player: state.last_move_by || 'shuki',
          san: state.last_move || '',
          uci: state.last_move || '',
          fenAfter: state.fen
        }];
        fensTimeline = [START_FEN, state.fen];
      } else {
        movesTimeline = [];
        fensTimeline = [START_FEN];
      }

      if (wasAtLatest || currentViewIndex >= fensTimeline.length) {
        currentViewIndex = fensTimeline.length - 1;
        isAtLatest = true;
      }
    }

    function updateUI(animate) {
      const shouldAnimate = (typeof animate === 'boolean') ? animate : true;
      const totalSteps = fensTimeline.length - 1;
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const mainText = document.getElementById('move-main-text');
      const subText = document.getElementById('move-subtext');

      // Update button disabled states
      btnPrev.disabled = (currentViewIndex <= 0);
      btnNext.disabled = (currentViewIndex >= totalSteps);

      // Update board position to currentViewIndex with smooth sliding animation
      const targetFen = fensTimeline[currentViewIndex] || START_FEN;
      if (board) {
        board.position(targetFen, shouldAnimate);
      }

      // Update text indicator
      if (currentViewIndex === totalSteps) {
        // We are at the live game state
        isAtLatest = true;
        if (!currentGameState) {
          mainText.textContent = "טוען...";
          subText.textContent = "";
          return;
        }

        const isTomerTurn = (currentGameState.turn === (currentGameState.tomer_color || 'w'));
        const colorHebrew = (currentGameState.tomer_color === 'b') ? 'שחור' : 'לבן';

        if (currentGameState.status === 'checkmate') {
          mainText.textContent = "מט! המשחק הסתיים";
          subText.textContent = "סך הכל " + totalSteps + " מהלכים";
        } else if (currentGameState.status === 'draw') {
          mainText.textContent = "תיקו! המשחק הסתיים";
          subText.textContent = "סך הכל " + totalSteps + " מהלכים";
        } else if (isTomerTurn) {
          mainText.textContent = "תורך לשחק (" + colorHebrew + ")";
          subText.textContent = totalSteps > 0 ? ("מהלך " + totalSteps + " מתוך " + totalSteps) : "תחילת משחק";
        } else {
          mainText.textContent = "תור שוקי...";
          subText.textContent = "מהלך " + totalSteps + " מתוך " + totalSteps;
        }
      } else if (currentViewIndex === 0) {
        // Start of game
        isAtLatest = false;
        mainText.textContent = "תחילת המשחק";
        subText.textContent = "0 מתוך " + totalSteps + " מהלכים";
      } else {
        // Middle of history
        isAtLatest = false;
        const moveItem = movesTimeline[currentViewIndex - 1];
        const moveColor = (currentViewIndex % 2 === 1) ? 'לבן' : 'שחור';
        const moveSan = (moveItem && moveItem.san) ? moveItem.san : '';
        mainText.textContent = "מהלך " + currentViewIndex + ": " + moveSan + " (" + moveColor + ")";
        subText.textContent = "צפייה בהיסטוריה (" + currentViewIndex + " / " + totalSteps + ")";
      }
    }

    function stepPrev() {
      if (currentViewIndex > 0) {
        currentViewIndex--;
        isAtLatest = (currentViewIndex === fensTimeline.length - 1);
        updateUI(true);
      }
    }

    function stepNext() {
      if (currentViewIndex < fensTimeline.length - 1) {
        currentViewIndex++;
        isAtLatest = (currentViewIndex === fensTimeline.length - 1);
        updateUI(true);
      }
    }

    function applyGameState(state) {
      currentGameState = state;
      const latestFen = state.fen || START_FEN;
      liveGame.load(latestFen);

      rebuildTimeline(state);

      const tomerColor = state.tomer_color === 'b' ? 'black' : 'white';
      if (board && board.orientation() !== tomerColor) {
        board.orientation(tomerColor);
      }

      if (!hasLoadedFirstState) {
        hasLoadedFirstState = true;
        updateUI(false);
      } else {
        updateUI(true);
      }
    }

    function syncState() {
      if (isMoving) return;
      google.script.run
        .withSuccessHandler(function(state) {
          if (state) {
            applyGameState(state);
          }
        })
        .withFailureHandler(function(err) {
          console.error("Sync error:", err);
        })
        .getGameState();
    }

    function resizeBoard() {
      if (board) {
        board.resize();
      }
    }

    function init() {
      const config = {
        draggable: true,
        position: 'start',
        showNotation: false,
        pieceTheme: pieceTheme,
        moveSpeed: 240,
        appearSpeed: 180,
        trashSpeed: 120,
        snapSpeed: 40,
        snapbackSpeed: 50,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      board = Chessboard('board', config);

      document.getElementById('btn-prev').addEventListener('click', stepPrev);
      document.getElementById('btn-next').addEventListener('click', stepNext);

      // Keyboard navigation support (ArrowLeft / ArrowRight)
      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') stepPrev();
        else if (e.key === 'ArrowRight') stepNext();
      });

      setTimeout(resizeBoard, 50);
      setTimeout(resizeBoard, 200);
      setTimeout(resizeBoard, 500);

      window.addEventListener('resize', resizeBoard);
      window.addEventListener('orientationchange', function() {
        setTimeout(resizeBoard, 150);
      });

      syncState();
      pollInterval = setInterval(syncState, 5000);
    }

    $(document).ready(init);
  </script>
</body>
</html>
